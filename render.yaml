services:
  - type: web
    name: focms-sas-election-api
    runtime: node
    rootDir: .
    buildCommand: npm ci --omit=dev --workspace backend
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173,https://focms-sas-elections-2k25.vercel.app,https://focms-sas-elections-2k25*.vercel.app"
      - key: AUTO_PING_ENABLED
        value: "true"
      - key: PING_INTERVAL_MINUTES
        value: "12"
